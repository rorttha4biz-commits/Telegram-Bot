<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exchange rate</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>:root{--bg:#efeff1;--card:#fff;--ink:#16161a;--mute:#8c8c94;--accent:#d9545d;--seg:#e4e4e8;--line:#efeff1;--green:#2e9e63}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(20px,env(safe-area-inset-top)) 16px 40px;max-width:520px;margin:auto}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:15px;margin:2px 0 16px}
.card{background:var(--card);border-radius:24px;padding:8px 20px;margin-bottom:14px}
.card.pad{padding:16px 20px}
.row{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.txt{flex:1;min-width:0}.t{font-size:17px}.m{color:var(--mute);font-size:14px;margin-top:2px}
.r{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--green)}.down{color:var(--accent)}
.tot{font-weight:700}
.seg{display:flex;background:var(--seg);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px 0;font:inherit;font-size:15px;border-radius:11px;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
input{width:100%;font:inherit;font-size:20px;padding:11px 12px;border:1px solid #e0e0e4;border-radius:12px;background:#fafafb}
.note{color:var(--mute);font-size:13px;text-align:center;margin-top:6px}
.back{display:inline-block;color:var(--accent);font-size:15px;font-weight:600;text-decoration:none;margin-bottom:10px}
.badge{font-size:13px;padding:3px 10px;border-radius:99px;background:#e6f5ec;color:var(--green)}
.badge.warn{background:#fbe9ea;color:var(--accent)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.bar strong{font-size:17px}
.bar button{border:0;background:none;color:var(--accent);font:inherit;font-size:15px;font-weight:600;padding:4px 0 4px 14px}
.sel{cursor:pointer}.box{width:28px;height:28px;border-radius:50%;border:2px solid #d4d4d9;flex:none;display:grid;place-items:center}
.sel.on .box{background:var(--accent);border-color:var(--accent)}.sel:not(.on) .box svg{display:none}
.sel:not(.on) .t,.sel:not(.on) .r{color:var(--mute)}
body{padding-bottom:110px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px max(16px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
.dock button{display:block;width:100%;max-width:488px;margin:auto;border:0;border-radius:16px;background:var(--accent);color:#fff;font:inherit;font-size:17px;font-weight:600;padding:15px}
.dock button:disabled{background:#cfcfd4}
.n{width:74px;font-size:14px}</style></head><body>
<a class="back" href="index.html">‹ Home</a>
<h1>Exchange rate</h1><p class="sub">1 USD equals · tap rows to include or skip</p>
<section class="card pad"><input id="amt" type="number" inputmode="decimal" value="100" aria-label="Amount in USD"></section><div id="barwrap"></div><section class="card" id="list"></section>
<div class="bar" style="display:none"></div>
<p class="note">Sample data for layout preview</p>
<div class="dock"><button id="copy">Copy</button></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
tg?.BackButton?.show();tg?.BackButton?.onClick(()=>location.href="index.html");
const $=id=>document.getElementById(id);
const money=n=>n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const num=n=>n.toFixed(2);
const check='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const barHTML='<div class="bar"><strong id="cnt"></strong><span><button id="all">Select all</button><button id="none">None</button></span></div>';
async function copyOut(text,n){
  try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}
  try{const a=JSON.parse(localStorage.getItem("copylog")||"[]");a.push({v:document.title,n:n,t:Date.now()});localStorage.setItem("copylog",JSON.stringify(a.slice(-500)))}catch(e){}tg?.HapticFeedback?.notificationOccurred("success");$("copy").textContent="Copied "+n+" row"+(n>1?"s":"");setTimeout(()=>refresh(),1800);
}
function setCopy(n){$("copy").disabled=!n;$("copy").textContent=n?"Copy "+n+" row"+(n>1?"s":""):"Select rows to copy"}
const rates=[["EUR","Euro",0.92,0.12],["GBP","British pound",0.79,-0.08],["JPY","Japanese yen",151.2,0.31],["SGD","Singapore dollar",1.34,0.05],["THB","Thai baht",35.8,-0.22],["CNY","Chinese yuan",7.24,0.02]].map(r=>({c:r[0],n:r[1],r:r[2],d:r[3],sel:true}));
$("barwrap").innerHTML=barHTML;
function refresh(){const a=parseFloat($("amt").value)||0;
$("list").innerHTML=rates.map((x,i)=>`<div class="row sel ${x.sel?"on":""}" data-i="${i}"><span class="box">${check}</span><div class="txt"><div class="t">${x.c}</div><div class="m">${x.n}</div></div><div class="r"><div class="t">${money(a*x.r)}</div><div class="m ${x.d>=0?"up":"down"}">${x.d>=0?"+":""}${x.d.toFixed(2)}% · ${x.r}</div></div></div>`).join("");
document.querySelectorAll(".sel").forEach(el=>el.onclick=()=>{const x=rates[el.dataset.i];x.sel=!x.sel;refresh()});
const n=rates.filter(x=>x.sel).length;$("cnt").textContent=n+" of "+rates.length+" selected";setCopy(n);
$("all").onclick=()=>{rates.forEach(x=>x.sel=true);refresh()};$("none").onclick=()=>{rates.forEach(x=>x.sel=false);refresh()}}
$("amt").oninput=refresh;
$("copy").onclick=()=>{const a=parseFloat($("amt").value)||0,s=rates.filter(x=>x.sel);
copyOut(["Currency\tName\tRate per 1 USD\tAmount USD\tConverted\tChange %"].concat(s.map(x=>[x.c,x.n,x.r,num(a),num(a*x.r),x.d.toFixed(2)].join("\t"))).join("\n"),s.length)};
refresh();
</script></body></html>
