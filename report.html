<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Summary report</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>:root{--bg:#efeff1;--card:#fff;--ink:#16161a;--mute:#8c8c94;--accent:#d9545d;--seg:#e4e4e8;--line:#efeff1;--green:#2e9e63}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(20px,env(safe-area-inset-top)) 16px 40px;max-width:520px;margin:auto}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:15px;margin:2px 0 16px}
.card{background:var(--card);border-radius:24px;padding:8px 20px;margin-bottom:14px}
.card.pad{padding:16px 20px}
.row{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.txt{flex:1;min-width:0}.t{font-size:17px}.m{color:var(--mute);font-size:14px;margin-top:2px}
.r{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--green)}.down{color:var(--accent)}
.tot{font-weight:700}
.seg{display:flex;background:var(--seg);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px 0;font:inherit;font-size:15px;border-radius:11px;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
input{width:100%;font:inherit;font-size:20px;padding:11px 12px;border:1px solid #e0e0e4;border-radius:12px;background:#fafafb}
.note{color:var(--mute);font-size:13px;text-align:center;margin-top:6px}
.back{display:inline-block;color:var(--accent);font-size:15px;font-weight:600;text-decoration:none;margin-bottom:10px}
.badge{font-size:13px;padding:3px 10px;border-radius:99px;background:#e6f5ec;color:var(--green)}
.badge.warn{background:#fbe9ea;color:var(--accent)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.bar strong{font-size:17px}
.bar button{border:0;background:none;color:var(--accent);font:inherit;font-size:15px;font-weight:600;padding:4px 0 4px 14px}
.sel{cursor:pointer}.box{width:28px;height:28px;border-radius:50%;border:2px solid #d4d4d9;flex:none;display:grid;place-items:center}
.sel.on .box{background:var(--accent);border-color:var(--accent)}.sel:not(.on) .box svg{display:none}
.sel:not(.on) .t,.sel:not(.on) .r{color:var(--mute)}
body{padding-bottom:110px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px max(16px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
.dock button{display:block;width:100%;max-width:488px;margin:auto;border:0;border-radius:16px;background:var(--accent);color:#fff;font:inherit;font-size:17px;font-weight:600;padding:15px}
.dock button:disabled{background:#cfcfd4}
.n{width:74px;font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:20px;padding:14px 16px}.stat b{display:block;font-size:28px;letter-spacing:-.02em}.stat span{color:var(--mute);font-size:13px}
.bars{display:flex;align-items:flex-end;gap:3px;height:96px}.bars i{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bars i.z{background:#ecc9cc}.lab{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin-top:6px}
.vbar{height:8px;border-radius:99px;background:var(--seg);margin-top:6px;overflow:hidden}.vbar i{display:block;height:100%;background:var(--accent)}</style></head><body>
<a class="back" href="index.html">‹ Home</a>
<h1>Summary report</h1><p class="sub" id="range"></p>
<div class="seg" id="seg"><button data-p="d" aria-pressed="true">Daily</button><button data-p="w" aria-pressed="false">Weekly</button><button data-p="m" aria-pressed="false">Monthly</button></div>
<div class="stats"><div class="stat"><b id="n"></b><span>Copies completed</span></div><div class="stat"><b id="items"></b><span>Rows or files copied</span></div></div>
<section class="card pad"><div class="bars" id="bars"></div><div class="lab" id="lab"></div></section>
<section class="card" id="views"></section>
<section class="card" id="list"></section>
<p class="note" id="foot"></p>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();tg?.BackButton?.show();tg?.BackButton?.onClick(()=>location.href="index.html");
const $=id=>document.getElementById(id);
const DAY=864e5,sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const VIEWS=["Source files","Exchange rate","Trial balance","Deposit listing"];
let log=[],sample=false;
try{log=JSON.parse(localStorage.getItem("copylog")||"[]")||[]}catch(e){}
if(!log.length){sample=true;for(let i=0;i<40;i++)log.push({v:VIEWS[i%4],n:2+(i*3)%9,t:Date.now()-((i*5)%30)*DAY-((i*7)%11)*36e5})}
let P="d";
const cfg={d:{days:1,label:"Today",prev:"yesterday"},w:{days:7,label:"Last 7 days",prev:"the 7 days before"},m:{days:30,label:"Last 30 days",prev:"the 30 days before"}};
const fmt=t=>new Date(t).toLocaleDateString("en-US",{month:"short",day:"numeric"})+", "+new Date(t).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
function draw(){
  const c=cfg[P],end=sod(Date.now())+DAY,start=end-c.days*DAY,ps=start-c.days*DAY;
  const cur=log.filter(x=>x.t>=start&&x.t<end).sort((a,b)=>b.t-a.t),prev=log.filter(x=>x.t>=ps&&x.t<start).length;
  const items=cur.reduce((a,x)=>a+x.n,0),df=cur.length-prev;
  $("range").textContent=c.label+" · "+(df>=0?"+":"")+df+" vs "+c.prev;
  $("n").textContent=cur.length;$("items").textContent=items;
  let b,labs;
  if(P==="d"){b=Array(8).fill(0);cur.forEach(x=>b[Math.floor(new Date(x.t).getHours()/3)]++);labs=["12a","6a","12p","6p"]}
  else{const n=c.days;b=Array(n).fill(0);cur.forEach(x=>b[Math.min(n-1,Math.floor((x.t-start)/DAY))]++);
    labs=P==="w"?Array.from({length:7},(_,i)=>new Date(start+i*DAY).toLocaleDateString("en-US",{weekday:"narrow"})):[fmt(start).split(",")[0],"Today"]}
  const mx=Math.max(1,...b);
  $("bars").innerHTML=b.map(v=>`<i class="${v?"":"z"}" style="height:${v?Math.max(8,v/mx*100):2}%"></i>`).join("");
  $("lab").innerHTML=labs.map(l=>`<span>${l}</span>`).join("");
  const per=VIEWS.map(v=>({v,k:cur.filter(x=>x.v===v).length,i:cur.filter(x=>x.v===v).reduce((a,x)=>a+x.n,0)})),mk=Math.max(1,...per.map(p=>p.k));
  $("views").innerHTML=per.map(p=>`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><div class="t" style="font-size:16px">${p.v}</div><div class="m">${p.k} cop${p.k===1?"y":"ies"} · ${p.i} rows</div></div><div class="vbar"><i style="width:${p.k/mk*100}%"></i></div></div>`).join("");
  $("list").innerHTML=cur.length?cur.slice(0,20).map(x=>`<div class="row"><div class="txt"><div class="t" style="font-size:16px">${x.v}</div><div class="m">${fmt(x.t)}</div></div><div class="m">${x.n} copied</div></div>`).join("")+(cur.length>20?`<div class="row m">and ${cur.length-20} more</div>`:""):`<div class="row m">No copies in this period yet.</div>`;
  $("foot").textContent=sample?"Sample data. Copy from any view to see your own.":"Based on copies made on this device.";
}
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{P=b.dataset.p;document.querySelectorAll("#seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));draw()});
draw();
</script></body></html>
